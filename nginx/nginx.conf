user  nginx;
worker_processes auto;

events {
  worker_connections  4096;
  multi_accept on;
}

http {

  # --- 已知爬虫 IP 段（供 conf.d/wordpress.conf 的不可缓存页封堵规则使用）---
  # 2026-08-07 事故：Meta 用 184 个 IP、UA 全部伪装成浏览器（所以 UA 匹配无效），
  # 连续 4 小时每小时 13000+ 请求，45% 打在 TranslatePress 翻译后的各语言购物车页上。
  # 加新段时保持「只封不可缓存页、不封商品页」的原则，避免影响正常收录。
  geo $bot_net {
    default        0;
    2a03:2880::/32 1;   # Meta / Facebook
  }

  # --- 20260731 修复：上游 DNS 运行时解析 ---
  # nginx 对字面主机名的 fastcgi_pass / upstream server 只在「配置加载时」解析一次，
  # 并把 IP 永久钉在 worker 进程里。容器重建换 IP 后会一直打旧地址
  # （2026-07-30 canopylumen 全站 502 持续 18h 的根因）。
  # 配合 server 块里的 `set $fpm_upstream ...` 变量写法，强制走运行时解析。
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  keepalive_timeout 65;
  types_hash_max_size 4096;

  # Next-gen image content negotiation: pick a sidecar suffix based on Accept.
  # Imagify writes sidecars as <file>.png.avif / <file>.png.webp next to originals;
  # the wordpress.conf image location uses these via try_files. Harmless when no
  # sidecar exists (falls back to the original file).
  map $http_accept $avif_suffix {
    default       "";
    "~image/avif" ".avif";
  }
  map $http_accept $webp_suffix {
    default       "";
    "~image/webp" ".webp";
  }

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;

  open_file_cache max=10000 inactive=60s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # NOTE: No fastcgi_cache zone here on purpose. Page caching is handled by
  # FlyingPress (full-page cache + smart purge). A second nginx page cache would
  # duplicate it and serve stale pages (nginx can't see FlyingPress purges).

  include /etc/nginx/conf.d/*.conf;
}
