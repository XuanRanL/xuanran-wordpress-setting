user  nginx;
worker_processes auto;

events {
  worker_connections  4096;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  keepalive_timeout 65;
  types_hash_max_size 4096;

  # Next-gen image content negotiation: pick a sidecar suffix based on Accept.
  # Imagify writes sidecars as <file>.png.avif / <file>.png.webp next to originals;
  # the wordpress.conf image location uses these via try_files. Harmless when no
  # sidecar exists (falls back to the original file).
  map $http_accept $avif_suffix {
    default       "";
    "~image/avif" ".avif";
  }
  map $http_accept $webp_suffix {
    default       "";
    "~image/webp" ".webp";
  }

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss image/svg+xml;

  open_file_cache max=10000 inactive=60s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # NOTE: No fastcgi_cache zone here on purpose. Page caching is handled by
  # FlyingPress (full-page cache + smart purge). A second nginx page cache would
  # duplicate it and serve stale pages (nginx can't see FlyingPress purges).

  include /etc/nginx/conf.d/*.conf;
}
