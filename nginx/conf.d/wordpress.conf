map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Cookie-based cache bypass. Currently only consumed by the OPTIONAL FlyingPress
# static-serve block below; keep it so that block is a 2-line uncomment away.
map $http_cookie $skip_cache {
  default 0;
  ~*wordpress_logged_in_      1;
  ~*wp-postpass_              1;
  ~*comment_author_           1;
  ~*woocommerce_items_in_cart 1;
  ~*woocommerce_cart_hash     1;
}

server {
  listen 80;
  # Accept whatever Host header Cloudflare Zero Trust injects.
  # To lock down later, replace `_` with: your-domain.com www.your-domain.com
  server_name _;
  root /var/www/html;
  index index.php;

  location = /healthz { return 200 "ok\n"; }

  client_max_body_size 64m;
  client_body_buffer_size 256k;     # avoid temp-file POST writes for AJAX payloads

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # --- hardening ---
  location ~ /\.                        { deny all; }
  location ~* /(\.git|\.svn|\.hg)/      { deny all; }
  location = /xmlrpc.php                { return 403; }   # remove if you need XML-RPC
  location ~* /(?:uploads|files)/.*\.php$ { deny all; }

  # --- Raster images with optional AVIF/WebP sidecars (Imagify) ---
  # Serves the smallest format the client accepts; falls back to the original.
  # Also fixes CSS background images that the <picture> method can't rewrite.
  location ~* \.(?:png|jpe?g)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Vary Accept;
    try_files $uri$avif_suffix $uri$webp_suffix $uri =404;
  }

  # --- Other static assets ---
  location ~* \.(?:css|js|gif|svg|ico|avif|webp|ttf|otf|eot|woff|woff2)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # ============================================================================
  # OPTIONAL — serve FlyingPress static HTML straight from nginx (bypass PHP for
  # logged-out GET visitors). This is FASTER than fastcgi_cache and stays in sync
  # because FlyingPress purges by deleting the file. Enable ONLY after confirming
  # wp-content/cache/flying-press/<host>/ is being generated, then reload nginx.
  #
  #   location / {
  #     set $fp "/wp-content/cache/flying-press/$host${uri}index.html";
  #     if ($request_method != GET)  { set $skip_cache 1; }
  #     if ($args)                   { set $skip_cache 1; }
  #     if ($skip_cache)             { set $fp "@dynamic"; }
  #     try_files $fp $uri $uri/ /index.php?$args;
  #   }
  # ============================================================================

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  # === Long-running admin endpoints (backup, import, schedules, cron) ===
  # Matches BEFORE the generic \.php$ block. Raises timeouts ONLY for
  # admin-ajax.php and wp-cron.php so normal traffic keeps the tight 120s
  # timeout (no slow-loris exposure on the whole site).
  location ~ ^/(wp-admin/admin-ajax\.php|wp-cron\.php)$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    fastcgi_pass wordpress:9000;
    fastcgi_read_timeout 7200;
    fastcgi_send_timeout 7200;
    fastcgi_connect_timeout 60;

    fastcgi_buffer_size 32k;
    fastcgi_buffers 64 32k;
    fastcgi_busy_buffers_size 64k;
  }

  location ~ \.php$ {
    try_files $uri =404;

    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

    fastcgi_pass wordpress:9000;
    fastcgi_read_timeout 120;
    fastcgi_send_timeout 60;
    fastcgi_connect_timeout 60;

    fastcgi_buffer_size 32k;
    fastcgi_buffers 64 32k;          # 2 MB total - fits large responses without temp file
    fastcgi_busy_buffers_size 64k;
  }
}
