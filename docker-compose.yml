services:
  wordpress:
    build:
      context: .
      dockerfile: php/Dockerfile
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_MEMORY_LIMIT', '1024M');
        define('WP_MAX_MEMORY_LIMIT', '1024M');
        define('DISALLOW_FILE_EDIT', false);
        if (!defined('WP_CACHE')) define('WP_CACHE', true);
        // WP-Cron is fired by an EXTERNAL system cron (see scripts/wp-cron.cron.example),
        // never on visitor requests. This keeps TTFB low and guarantees scheduled
        // tasks (FlyingPress preload, backups) run even on low-traffic sites.
        define('DISABLE_WP_CRON', true);
        // Redis object cache (read by the "Redis Object Cache" plugin)
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_DATABASE', 0);
        define('WP_REDIS_MAXTTL', 43200);
        // FlyingPress preload concurrency. Plugin default 1, hard cap 4.
        // KEEP THIS AT 1 ON A MULTI-SITE HOST. Raising it speeds up a single
        // site's purge drain, but the cost is multiplied by every site sharing
        // the box: a preload task FETCHES the page over HTTP, so each runner
        // also ties up a second worker to render it. At 3, nine sites purging
        // together (xuanran-ml's backlog-drained edge does exactly that) put
        // ~54 concurrent WooCommerce renders on 16 vCPU — load average 35, and
        // public TTFB on cf-cache-status=EXPIRED pages went 0.1s -> 8-14s.
        // Incident 2026-08-03; see skill gotcha 19. Raise ONLY on a host
        // running a single site, and lower it back before adding a second.
        define('FLYING_PRESS_PRELOAD_CONCURRENCY', 1);
    volumes:
      - ./html:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    # Cap the docker json-file log. Docker's default is UNBOUNDED -- the log only
    # ever resets when the container is *recreated*, so long-lived sites silently
    # accumulate. Measured on the 12-site fleet 2026-07-29 before this landed:
    # 751MB of container logs, single containers at 78-134MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - wordpress
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"    # Cloudflare Tunnel connects here; set per-site in .env
      # 20260731 收紧：仅本机可达，cloudflared 经 localhost 回源，杜绝绕过 Cloudflare 直连源站
    volumes:
      - ./html:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/wordpress.conf:/etc/nginx/conf.d/wordpress.conf:ro
      - ./nginx/conf.d/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      # NOTE: do NOT bind-mount /var/cache/nginx. The image pre-creates the temp
      # dirs (client_temp, proxy_temp, ...) there; mounting a host dir over it
      # shadows them, so nginx can't spool large request bodies (e.g. plugin .zip
      # uploads via wp-admin/update.php) and returns 5xx ("502 Bad Gateway" via
      # the Cloudflare tunnel). We use no nginx-level cache, so the dir isn't needed.
    healthcheck:
      # Force IPv4 to avoid localhost resolving to IPv6 (::1) where nginx is not listening
      test: ["CMD-SHELL", "wget -T 5 -qO- http://127.0.0.1/healthz >/dev/null && wget -T 5 -qO- http://127.0.0.1:8080/_fpm_ping | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 5
    # Cap the docker json-file log. Docker's default is UNBOUNDED -- the log only
    # ever resets when the container is *recreated*, so long-lived sites silently
    # accumulate. Measured on the 12-site fleet 2026-07-29 before this landed:
    # 751MB of container logs, single containers at 78-134MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  db:
    image: mysql:8.4.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # InnoDB
      - --innodb-buffer-pool-size=536870912      # 512M default (raise per-site for DB-heavy stores)
      - --innodb-redo-log-capacity=536870912
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --innodb-io-capacity=1000
      - --innodb-io-capacity-max=4000
      - --innodb-read-io-threads=8
      - --innodb-write-io-threads=8
      # Temp tables & buffers
      - --tmp-table-size=134217728
      - --max-heap-table-size=134217728
      - --sort-buffer-size=2097152
      - --join-buffer-size=2097152
      - --read-buffer-size=262144
      - --read-rnd-buffer-size=524288
      # Connections & threads
      - --max-connections=200
      - --thread-cache-size=32
      # Binary log disabled (no replication / no PITR via binlog)
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WP_DB_NAME}
      MYSQL_USER: ${WP_DB_USER}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD}
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p${DB_ROOT_PASSWORD} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
    # Cap the docker json-file log. Docker's default is UNBOUNDED -- the log only
    # ever resets when the container is *recreated*, so long-lived sites silently
    # accumulate. Measured on the 12-site fleet 2026-07-29 before this landed:
    # 751MB of container logs, single containers at 78-134MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  redis:
    image: redis:7-alpine
    # Pure cache: no persistence, capped memory, LRU eviction.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    # Cap the docker json-file log. Docker's default is UNBOUNDED -- the log only
    # ever resets when the container is *recreated*, so long-lived sites silently
    # accumulate. Measured on the 12-site fleet 2026-07-29 before this landed:
    # 751MB of container logs, single containers at 78-134MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  wpcli:
    build:
      context: .
      dockerfile: php/Dockerfile.cli
    user: "33:33"
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WP_DB_NAME}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_MEMORY_LIMIT', '1024M');
        define('WP_MAX_MEMORY_LIMIT', '1024M');
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_DATABASE', 0);
        // Must match the `wordpress` service. WP-CLI otherwise runs wp_cron() on init
        // and spawns a loopback request to wp-cron.php on EVERY command. Set it here,
        // never with `wp config set` -- appending a second define() to wp-config.php
        // (which already eval()s WORDPRESS_CONFIG_EXTRA) emits
        // "Constant DISABLE_WP_CRON already defined" on every request.
        define('DISABLE_WP_CRON', true);
        // FlyingPress preload concurrency. Plugin default 1, hard cap 4.
        // KEEP THIS AT 1 ON A MULTI-SITE HOST. Raising it speeds up a single
        // site's purge drain, but the cost is multiplied by every site sharing
        // the box: a preload task FETCHES the page over HTTP, so each runner
        // also ties up a second worker to render it. At 3, nine sites purging
        // together (xuanran-ml's backlog-drained edge does exactly that) put
        // ~54 concurrent WooCommerce renders on 16 vCPU — load average 35, and
        // public TTFB on cf-cache-status=EXPIRED pages went 0.1s -> 8-14s.
        // Incident 2026-08-03; see skill gotcha 19. Raise ONLY on a host
        // running a single site, and lower it back before adding a second.
        define('FLYING_PRESS_PRELOAD_CONCURRENCY', 1);
    volumes:
      - ./html:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - /tmp:/tmp
    entrypoint: [ "bash", "-lc" ]
    command: >
      "wp core is-installed || exit 0"
    depends_on:
      - wordpress
      - db
      - redis
    # Cap the docker json-file log. Docker's default is UNBOUNDED -- the log only
    # ever resets when the container is *recreated*, so long-lived sites silently
    # accumulate. Measured on the 12-site fleet 2026-07-29 before this landed:
    # 751MB of container logs, single containers at 78-134MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: "no"

volumes:
  db_data:
