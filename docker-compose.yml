services:
  wordpress:
    build:
      context: .
      dockerfile: php/Dockerfile
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WP_DB_USER:?WP_DB_USER must be set in .env}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?WP_DB_PASSWORD must be set in .env}
      WORDPRESS_DB_NAME: ${WP_DB_NAME:?WP_DB_NAME must be set in .env}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_MEMORY_LIMIT', '1024M');
        define('WP_MAX_MEMORY_LIMIT', '1024M');
        // The built-in theme/plugin code editor is off: an administrator account that falls into the wrong
        // hands cannot rewrite PHP files from wp-admin. Installing, updating and deleting plugins and themes
        // in wp-admin is NOT affected (that would be the FILE_MODS constant, which this fleet never sets:
        // the owner updates plugins by hand).
        define('DISALLOW_FILE_EDIT', true);
        // WordPress installs security and maintenance releases (7.1.x) by itself. A new major version (7.2)
        // is installed by hand after a test on one site: 30 stores must not change major version overnight.
        define('WP_AUTO_UPDATE_CORE', 'minor');
        if (!defined('WP_CACHE')) define('WP_CACHE', true);
        // WP-Cron is fired by an EXTERNAL system cron (see scripts/wp-cron.cron.example),
        // never on visitor requests. This keeps TTFB low and guarantees scheduled
        // tasks (FlyingPress preload, backups) run even on low-traffic sites.
        define('DISABLE_WP_CRON', true);
        // Redis object cache (read by the "Redis Object Cache" plugin)
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_DATABASE', 0);
        define('WP_REDIS_MAXTTL', 43200);
        // FlyingPress preload concurrency. Plugin default 1, hard cap 4.
        // KEEP THIS AT 1 ON A MULTI-SITE HOST. Raising it speeds up a single
        // site's purge drain, but the cost is multiplied by every site sharing
        // the box: a preload task FETCHES the page over HTTP, so each runner
        // also ties up a second worker to render it. At 3, nine sites purging
        // together (xuanran-ml's backlog-drained edge does exactly that) put
        // ~54 concurrent WooCommerce renders on 16 vCPU — load average 35, and
        // public TTFB on cf-cache-status=EXPIRED pages went 0.1s -> 8-14s.
        // Incident 2026-08-03; see skill gotcha 19. Raise ONLY on a host
        // running a single site, and lower it back before adding a second.
        define('FLYING_PRESS_PRELOAD_CONCURRENCY', 1);
    volumes:
      - ./html:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - ./php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/_fpm_ping SCRIPT_FILENAME=/_fpm_ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 5
    # Cap the docker json-file log. Docker's default is UNBOUNDED -- the log only
    # ever resets when the container is *recreated*, so long-lived sites silently
    # accumulate. Measured on the 12-site fleet 2026-07-29 before this landed:
    # 751MB of container logs, single containers at 78-134MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  nginx:
    image: nginx:1.30-alpine@sha256:3bc3836dc0be3b811f238210360bf8e7ca8a2d0effdae46160bf1f3578710051
    # Keep the container ceiling consistent with worker_rlimit_nofile; do not
    # depend on the Docker daemon's host-specific default (sometimes 1,024).
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NGINX_PORT:?NGINX_PORT must be set in .env}:80"    # Cloudflare Tunnel connects here; set per-site in .env
      # 20260731 收紧：仅本机可达，cloudflared 经 localhost 回源，杜绝绕过 Cloudflare 直连源站
    volumes:
      - ./html:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/wordpress.conf:/etc/nginx/conf.d/wordpress.conf:ro
      - ./nginx/conf.d/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      # NOTE: do NOT bind-mount /var/cache/nginx. The image pre-creates the temp
      # dirs (client_temp, proxy_temp, ...) there; mounting a host dir over it
      # shadows them, so nginx can't spool large request bodies (e.g. plugin .zip
      # uploads via wp-admin/update.php) and returns 5xx ("502 Bad Gateway" via
      # the Cloudflare tunnel). We use no nginx-level cache, so the dir isn't needed.
    healthcheck:
      # Force IPv4 to avoid localhost resolving to IPv6 (::1) where nginx is not listening
      test: ["CMD-SHELL", "wget -T 5 -qO- http://127.0.0.1/healthz >/dev/null && wget -T 5 -qO- http://127.0.0.1:8080/_fpm_ping | grep -q pong"]
      interval: 30s
      # Two sequential five-second probes plus process-start/pipe margin.
      timeout: 12s
      retries: 5
    # Cap the docker json-file log. Docker's default is UNBOUNDED -- the log only
    # ever resets when the container is *recreated*, so long-lived sites silently
    # accumulate. Measured on the 12-site fleet 2026-07-29 before this landed:
    # 751MB of container logs, single containers at 78-134MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  db:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # InnoDB
      - --innodb-buffer-pool-size=536870912      # 512M default (raise per-site for DB-heavy stores)
      - --innodb-redo-log-capacity=536870912
      # 1: every committed transaction (an order) is on disk before the shop answers. 2 flushes once per
      # second and can lose that second on a power cut; it is only for a host whose data disk needs several
      # milliseconds per synced write (MYSQL_FLUSH_LOG_AT_TRX_COMMIT=2 in .env; how to measure: README).
      - --innodb-flush-log-at-trx-commit=${MYSQL_FLUSH_LOG_AT_TRX_COMMIT:-1}
      - --innodb-flush-method=O_DIRECT
      - --innodb-io-capacity=1000
      - --innodb-io-capacity-max=4000
      - --innodb-read-io-threads=8
      - --innodb-write-io-threads=8
      # Temp tables & buffers
      - --tmp-table-size=134217728
      - --max-heap-table-size=134217728
      - --sort-buffer-size=2097152
      - --join-buffer-size=2097152
      - --read-buffer-size=262144
      - --read-rnd-buffer-size=524288
      # Connections & threads
      - --max-connections=200
      - --thread-cache-size=32
      # Binary log disabled (no replication / no PITR via binlog)
      - --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${WP_DB_NAME:?WP_DB_NAME must be set in .env}
      MYSQL_USER: ${WP_DB_USER:?WP_DB_USER must be set in .env}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:?WP_DB_PASSWORD must be set in .env}
    volumes:
      - ./db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -u root --execute=\"SELECT 1\" >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 10
    # Cap the docker json-file log. Docker's default is UNBOUNDED -- the log only
    # ever resets when the container is *recreated*, so long-lived sites silently
    # accumulate. Measured on the 12-site fleet 2026-07-29 before this landed:
    # 751MB of container logs, single containers at 78-134MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  redis:
    image: redis:8.10.3-alpine3.23@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    # Pure cache: no persistence, capped memory, LRU eviction.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    # Cap the docker json-file log. Docker's default is UNBOUNDED -- the log only
    # ever resets when the container is *recreated*, so long-lived sites silently
    # accumulate. Measured on the 12-site fleet 2026-07-29 before this landed:
    # 751MB of container logs, single containers at 78-134MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: always

  wpcli:
    build:
      context: .
      dockerfile: php/Dockerfile.cli
    user: "33:33"
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WP_DB_USER:?WP_DB_USER must be set in .env}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:?WP_DB_PASSWORD must be set in .env}
      WORDPRESS_DB_NAME: ${WP_DB_NAME:?WP_DB_NAME must be set in .env}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_MEMORY_LIMIT', '1024M');
        define('WP_MAX_MEMORY_LIMIT', '1024M');
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PORT', 6379);
        define('WP_REDIS_DATABASE', 0);
        // Must match the `wordpress` service. WP-CLI otherwise runs wp_cron() on init
        // and spawns a loopback request to wp-cron.php on EVERY command. Set it here,
        // never with `wp config set` -- appending a second define() to wp-config.php
        // (which already eval()s WORDPRESS_CONFIG_EXTRA) emits
        // "Constant DISABLE_WP_CRON already defined" on every request.
        define('DISABLE_WP_CRON', true);
        // FlyingPress preload concurrency. Plugin default 1, hard cap 4.
        // KEEP THIS AT 1 ON A MULTI-SITE HOST. Raising it speeds up a single
        // site's purge drain, but the cost is multiplied by every site sharing
        // the box: a preload task FETCHES the page over HTTP, so each runner
        // also ties up a second worker to render it. At 3, nine sites purging
        // together (xuanran-ml's backlog-drained edge does exactly that) put
        // ~54 concurrent WooCommerce renders on 16 vCPU — load average 35, and
        // public TTFB on cf-cache-status=EXPIRED pages went 0.1s -> 8-14s.
        // Incident 2026-08-03; see skill gotcha 19. Raise ONLY on a host
        // running a single site, and lower it back before adding a second.
        define('FLYING_PRESS_PRELOAD_CONCURRENCY', 1);
    volumes:
      - ./html:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
      - /tmp:/tmp
    entrypoint: [ "bash", "-lc" ]
    command: >
      "wp core is-installed || exit 0"
    depends_on:
      - wordpress
      - db
      - redis
    # Cap the docker json-file log. Docker's default is UNBOUNDED -- the log only
    # ever resets when the container is *recreated*, so long-lived sites silently
    # accumulate. Measured on the 12-site fleet 2026-07-29 before this landed:
    # 751MB of container logs, single containers at 78-134MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: "no"

volumes:
  db_data:
