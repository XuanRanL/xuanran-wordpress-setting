opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; validate_timestamps=1 + 60s revalidate: WordPress plugin/theme/core updates done
; through wp-admin are picked up automatically within a minute. With =0 you MUST
; reset OPcache after every update or risk running half-old bytecode (fatals/WSOD).
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; JIT disabled fleet-wide. Historical SIGSEGV/OOM with PHP 8.3 JIT +
; Wordfence (auto_prepend_file) + heavy plugins. OPcache without JIT already
; gives ~95% of the benefit for WordPress with zero stability risk.
opcache.jit=0
opcache.jit_buffer_size=0
