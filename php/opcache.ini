opcache.enable=1
opcache.enable_cli=0

; Sized for WordPress + WooCommerce + a page-builder theme + a translation plugin.
; At 256 MB / 32 MB these stacks fill up (2026-10-25, 29 sites: 11 caches had
; 1-9 MB free, interned strings 0% free on 13). A full cache schedules a restart;
; until every running request ends PHP serves without bytecode cache, and long
; requests (translation, backups, imports) keep it waiting until they are killed.
; Interned strings come out of memory_consumption, so both go up together; at
; 512 / 128 the same sites keep 34-69% of the string buffer free.
; Both sizes are reserved when PHP-FPM starts: restart the PHP container, a reload
; does not apply them. Check from inside PHP-FPM with opcache_get_status(false);
; the CLI has its own (disabled) cache and shows nothing about the web's.
opcache.memory_consumption=512
opcache.interned_strings_buffer=128
opcache.max_accelerated_files=20000

; validate_timestamps=1 + 60s revalidate: WordPress plugin/theme/core updates done
; through wp-admin are picked up automatically within a minute. With =0 you MUST
; reset OPcache after every update or risk running half-old bytecode (fatals/WSOD).
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; JIT disabled fleet-wide. Historical SIGSEGV/OOM with PHP 8.3 JIT +
; Wordfence (auto_prepend_file) + heavy plugins. OPcache without JIT already
; gives ~95% of the benefit for WordPress with zero stability risk.
opcache.jit=0
opcache.jit_buffer_size=0
