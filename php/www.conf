[www]
user = www-data
group = www-data
listen = 9000
listen.mode = 0660

; Process manager. Sized for a ~32GB/16-core host shared by several sites.
; Rule of thumb: pm.max_children ≈ (RAM you'll give PHP) / (~64MB per worker).
; Lower these for small sites; raise for a dedicated/high-traffic box.
pm = dynamic
pm.max_children = 64
pm.start_servers = 16
pm.min_spare_servers = 12
pm.max_spare_servers = 32
pm.max_requests = 500

catch_workers_output = yes
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Pool-wide upper bound for a single request. Normal requests are still bound by
; PHP max_execution_time (320s, uploads.ini). The nginx location for
; admin-ajax.php / wp-cron.php raises read/send timeouts to 2h for long jobs
; (backups, imports, preload); this matches that ceiling instead of killing them.
request_terminate_timeout = 7200s
request_slowlog_timeout   = 60s
slowlog                   = /proc/self/fd/2

; Wordfence WAF - load before WordPress (enable after installing Wordfence).
; php_value[auto_prepend_file] = /var/www/html/wordfence-waf.php
